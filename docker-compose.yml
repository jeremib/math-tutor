# Optional: a local Postgres for testing the production setup.
#   docker compose up -d
#   DATABASE_URL=postgres://mathtutor:mathtutor@localhost:5432/mathtutor npm run dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mathtutor
      POSTGRES_PASSWORD: mathtutor
      POSTGRES_DB: mathtutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:

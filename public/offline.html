<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>Offline — Math Buddy</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8fafc;
      color: #1e293b;
      font-family: Nunito, ui-rounded, system-ui, sans-serif;
    }
    main { max-width: 28rem; text-align: center; }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #1d4ed8;
      font-size: 1.25rem;
      font-weight: 800;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 22px;
    }
    h1 { margin: 24px 0 8px; font-size: 1.75rem; letter-spacing: -0.02em; }
    p { margin: 0; color: #475569; line-height: 1.5; }
    button {
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 10px 16px;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <div class="logo"><span class="mark" aria-hidden="true">÷</span> Math Buddy</div>
    <h1>You're offline</h1>
    <p>Math Buddy needs a connection to load new problems. Check your Wi-Fi or cell service, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
